{
  "services": [
    {
      "type": "web",
      "runtime": "node",
      "name": "ramayana-api",
      "buildCommand": "npm install",
      "startCommand": "npx tsx server.ts",
      "envVars": [
        { "key": "NODE_ENV", "value": "production" },
        { "key": "GEMINI_API_KEY", "sync": false },
        { "key": "GOOGLE_CLOUD_PROJECT", "sync": false },
        { "key": "GOOGLE_CLOUD_LOCATION", "sync": false },
        { "key": "GOOGLE_APPLICATION_CREDENTIALS_JSON", "sync": false }
      ]
    }
  ]
}
